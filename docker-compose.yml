version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "8000:8000"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DB_ENGINE=django.db.backends.sqlite3
      - USE_SQLITE=true
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    depends_on:
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sh", "-c", "cd /app/backend && celery -A dpi_core worker -l INFO"]
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DB_ENGINE=django.db.backends.sqlite3
      - USE_SQLITE=true
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    depends_on:
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sh", "-c", "cd /app/backend && celery -A dpi_core beat -l INFO"]
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DB_ENGINE=django.db.backends.sqlite3
      - USE_SQLITE=true
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    depends_on:
      redis:
        condition: service_healthy
